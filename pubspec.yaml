name: biometric_change_detector
description: "Detect when enrolled biometrics (fingerprint, Face ID, Touch ID) change, using Android Keystore key invalidation and the iOS LocalAuthentication domain state."
version: 0.1.0
repository: https://github.com/phamhuudat/biometric_change_detector
issue_tracker: https://github.com/phamhuudat/biometric_change_detector/issues
topics: [biometrics, fingerprint, face-id, security, keystore]

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.phamhuudat.biometric_change_detector
        pluginClass: BiometricChangeDetectorPlugin
      ios:
        pluginClass: BiometricChangeDetectorPlugin
